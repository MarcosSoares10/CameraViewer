<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CameraViewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --line: #2c313c;
    --text: #e6e8ec; --muted: #8b92a1; --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 600; }
  button, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                 padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #46506a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { padding: 4px 8px; font-size: 13px; }
  select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                  padding: 7px 9px; font: inherit; width: 100%; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }

  main { padding: 16px; }
  #grid { display: grid; gap: 12px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
  .tile { background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative;
          aspect-ratio: 16/9; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
  .tile .bar { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px;
               background: linear-gradient(#000c, #0000); }
  .tile .name { font-weight: 600; text-shadow: 0 1px 2px #000; margin-right: auto; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .tile .tools { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .tile:hover .tools, .tile:focus-within .tools { opacity: 1; }
  .tools button { background: #000a; border-color: #fff3; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.live { background: var(--ok); } .dot.bad { background: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 80px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty p { margin: 0 0 14px; }

  aside#search { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel);
                 border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s;
                 z-index: 10; display: flex; flex-direction: column; }
  aside#search.open { transform: none; }
  aside .head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  aside .head h2 { font-size: 15px; margin: 0 auto 0 0; }
  aside .body { padding: 4px 16px 16px; overflow: auto; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  #scanMsg { margin: 14px 0 6px; color: var(--muted); min-height: 20px; }
  #scanMsg.err { color: var(--bad); }
  .result { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--panel2); }
  .result .t { display: flex; align-items: center; gap: 8px; }
  .result .t b { margin-right: auto; }
  .result .url { color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 4px; }
  .result .err { color: var(--warn); font-size: 12px; margin-top: 4px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0;
           width: min(520px, calc(100% - 32px)); }
  dialog::backdrop { background: #000a; }
  dialog form { padding: 16px; }
  dialog h2 { font-size: 15px; margin: 0 0 4px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; align-items: center; }
  dialog .actions span { margin-right: auto; font-size: 12px; color: var(--muted); }

  #viewer { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; }
  #viewer.open { display: flex; }
  #viewer .vbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #111; }
  #viewer .vbar b { margin-right: auto; }
  #viewer .vbar small { color: var(--muted); }
  #viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }

  @media (max-width: 700px) { #grid { grid-template-columns: 1fr !important; } .tile .tools { opacity: 1; } }
</style>
</head>
<body>
<header>
  <h1>CameraViewer</h1>
  <label for="cols" style="margin:0">Colunas</label>
  <select id="cols" style="width:auto">
    <option>1</option><option selected>2</option><option>3</option><option>4</option>
  </select>
  <button onclick="openEdit()">+ Adicionar URL</button>
  <button class="primary" onclick="toggleSearch(true)">Procurar câmeras</button>
</header>

<main>
  <div id="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>Nenhuma câmera adicionada ainda.</p>
    <button class="primary" onclick="toggleSearch(true)">Procurar câmeras na rede</button>
  </div>
</main>

<aside id="search">
  <div class="head"><h2>Procurar câmeras na rede</h2><button class="icon" onclick="toggleSearch(false)">✕</button></div>
  <div class="body">
    <div class="row">
      <div><label for="user">Usuário da câmera</label><input id="user" autocomplete="off"></div>
      <div><label for="pass">Senha</label><input id="pass" type="password" autocomplete="new-password"></div>
    </div>
    <p class="hint" id="passHint"></p>
    <label for="subnet">Sub-rede (opcional)</label>
    <input id="subnet" placeholder="ex.: 192.168.0.0/24">
    <p class="hint" id="netHint"></p>
    <button class="primary" id="scanBtn" style="width:100%;margin-top:14px" onclick="startScan()">Procurar</button>
    <div id="scanMsg"></div>
    <div id="results"></div>
  </div>
</aside>

<dialog id="edit">
  <form method="dialog" onsubmit="return false">
    <h2 id="editTitle">Adicionar câmera</h2>
    <label for="eName">Nome</label><input id="eName">
    <label for="eMain">URL principal (RTSP)</label>
    <input id="eMain" placeholder="rtsp://usuario:senha@192.168.0.10:554/onvif1">
    <label for="eSub">URL do sub-stream, mais leve, usada na grade (opcional)</label>
    <input id="eSub" placeholder="rtsp://usuario:senha@192.168.0.10:554/onvif2">
    <div class="actions">
      <span id="testMsg"></span>
      <button onclick="testUrl()">Testar</button>
      <button onclick="edit.close()">Cancelar</button>
      <button class="primary" onclick="saveEdit()">Salvar</button>
    </div>
  </form>
</dialog>

<div id="viewer">
  <div class="vbar">
    <span class="dot" id="vDot"></span><b id="vName"></b><small id="vInfo"></small>
    <button class="icon" id="vSnap">Foto</button>
    <button class="icon" onclick="closeViewer()">Fechar ✕</button>
  </div>
  <img id="vImg" alt="">
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (url, opts = {}) => {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opts,
                              body: opts.body ? JSON.stringify(opts.body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cameras = [];
const players = new Map();   // elemento img -> {stop}

/* ---------- player: busca quadro a quadro (long-poll), sem prender conexões ---------- */
function play(img, camId, quality, onStatus) {
  let seq = -1, alive = true, url = null;
  (async function loop() {
    while (alive) {
      try {
        const r = await fetch(`/frame/${camId}?q=${quality}&after=${seq}`, {cache: 'no-store'});
        if (!r.ok) throw new Error(r.status);
        seq = +r.headers.get('X-Seq');
        onStatus?.(r.headers.get('X-Status'), r.headers.get('X-Size'));
        const blob = await r.blob();
        if (!alive) break;
        const next = URL.createObjectURL(blob);
        img.src = next;
        if (url) URL.revokeObjectURL(url);
        url = next;
      } catch (e) {
        onStatus?.('Erro', '');
        await new Promise(res => setTimeout(res, 2000));
      }
    }
    if (url) URL.revokeObjectURL(url);
  })();
  return {stop() { alive = false; }};
}
function stopAll() { players.forEach(p => p.stop()); players.clear(); }

function dotClass(status) {
  return status === 'Ao vivo' ? 'dot live' : /Sem sinal|Erro/.test(status || '') ? 'dot bad' : 'dot';
}

/* ---------- grade ---------- */
async function loadCameras() {
  cameras = await api('/api/cameras');
  renderGrid();
}

function renderGrid() {
  stopAll();
  const grid = $('#grid');
  $('#empty').hidden = cameras.length > 0;
  grid.innerHTML = cameras.map(c => `
    <div class="tile" data-id="${c.id}">
      <img alt="${esc(c.name)}" title="Clique para ampliar">
      <div class="bar">
        <span class="dot" title="Conectando"></span>
        <span class="name">${esc(c.name)}</span>
        <div class="tools">
          <button class="icon" data-act="snap" title="Baixar foto">Foto</button>
          <button class="icon" data-act="edit" title="Editar">Editar</button>
          <button class="icon" data-act="del" title="Remover">✕</button>
        </div>
      </div>
    </div>`).join('');
  grid.querySelectorAll('.tile').forEach(tile => {
    const id = tile.dataset.id, img = tile.querySelector('img'), dot = tile.querySelector('.dot');
    players.set(img, play(img, id, 'grid', s => { dot.className = dotClass(s); dot.title = s; }));
  });
}

$('#grid').addEventListener('click', async e => {
  const tile = e.target.closest('.tile'); if (!tile) return;
  const cam = cameras.find(c => c.id === tile.dataset.id);
  const act = e.target.closest('button')?.dataset.act;
  if (act === 'snap') location.href = `/snapshot/${cam.id}`;
  else if (act === 'edit') openEdit(cam);
  else if (act === 'del') {
    if (confirm(`Remover "${cam.name}"?`)) { await api(`/api/cameras/${cam.id}`, {method: 'DELETE'}); loadCameras(); }
  } else if (e.target.tagName === 'IMG') openViewer(cam);
});

const cols = $('#cols');
try { cols.value = localStorage.getItem('cols') || '2'; } catch {}
const applyCols = () => { $('#grid').style.setProperty('--cols', cols.value); try { localStorage.setItem('cols', cols.value); } catch {} };
cols.onchange = applyCols; applyCols();

/* ---------- tela cheia (stream principal) ---------- */
let viewerPlayer = null;
function openViewer(cam) {
  stopAll();   // libera banda: só a câmera ampliada fica tocando
  $('#vName').textContent = cam.name;
  $('#vInfo').textContent = '';
  $('#vSnap').onclick = () => location.href = `/snapshot/${cam.id}`;
  $('#viewer').classList.add('open');
  viewerPlayer = play($('#vImg'), cam.id, 'main', (s, size) => {
    $('#vDot').className = dotClass(s);
    $('#vInfo').textContent = [s, size && size !== '0x0' ? size : ''].filter(Boolean).join(' · ');
  });
}
function closeViewer() {
  viewerPlayer?.stop(); viewerPlayer = null;
  $('#viewer').classList.remove('open'); $('#vImg').removeAttribute('src');
  renderGrid();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && viewerPlayer) closeViewer(); });

/* ---------- adicionar / editar ---------- */
const edit = $('#edit');
let editing = null, afterSave = null;
function openEdit(cam = null, preset = {}) {
  editing = cam; afterSave = null;
  const src = cam || preset;
  $('#editTitle').textContent = cam ? 'Editar câmera' : 'Adicionar câmera';
  $('#eName').value = src.name || '';
  $('#eMain').value = src.rtsp_main || '';
  $('#eSub').value = src.rtsp_sub || '';
  $('#testMsg').textContent = '';
  edit.showModal();
}
async function testUrl() {
  const url = $('#eMain').value.trim();
  $('#testMsg').textContent = 'Testando...';
  try {
    const r = await api('/api/test', {method: 'POST', body: {url}});
    $('#testMsg').textContent = r.ok ? `OK, ${r.width}x${r.height}` : r.error;
  } catch (e) { $('#testMsg').textContent = e.message; }
}
async function saveEdit() {
  const body = {name: $('#eName').value.trim() || 'Câmera', rtsp_main: $('#eMain').value.trim(),
                rtsp_sub: $('#eSub').value.trim()};
  try {
    if (editing) await api(`/api/cameras/${editing.id}`, {method: 'PATCH', body});
    else await api('/api/cameras', {method: 'POST', body});
    afterSave?.(); afterSave = null;
    edit.close(); loadCameras();
  } catch (e) { $('#testMsg').textContent = e.message; }
}

/* ---------- busca na rede ---------- */
async function toggleSearch(open) {
  $('#search').classList.toggle('open', open);
  if (!open) return;
  const cfg = await api('/api/config');
  if (!$('#user').value) $('#user').value = cfg.user;
  $('#subnet').value ||= cfg.subnet;
  $('#passHint').textContent = cfg.has_password ? 'Senha salva; deixe em branco para reaproveitá-la.' : '';
  $('#netHint').textContent = cfg.networks.length ? `Em branco = rede desta máquina (${cfg.networks.join(', ')})` : '';
  const st = await api('/api/scan');
  if (st.running) pollScan(); else showScan(st);
}

async function startScan() {
  try {
    await api('/api/scan', {method: 'POST', body: {user: $('#user').value, password: $('#pass').value,
                                                   subnet: $('#subnet').value}});
    pollScan();
  } catch (e) { $('#scanMsg').className = 'err'; $('#scanMsg').textContent = e.message; }
}

let scanResults = [];
async function pollScan() {
  $('#scanBtn').disabled = true;
  $('#results').innerHTML = '';
  for (;;) {
    const st = await api('/api/scan');
    showScan(st);
    if (!st.running) break;
    await new Promise(r => setTimeout(r, 700));
  }
  $('#scanBtn').disabled = false;
}

function showScan(st) {
  const msg = $('#scanMsg');
  msg.className = st.error ? 'err' : '';
  msg.textContent = st.error || st.message || '';
  if (st.running) return;
  scanResults = st.results || [];
  if (!scanResults.length && st.message) msg.textContent += '. Confira se as câmeras estão na mesma rede, ou informe a sub-rede.';
  $('#results').innerHTML = scanResults.map((c, i) => `
    <div class="result">
      <div class="t">
        <b>${esc(c.name)}</b><span class="tag">${c.onvif ? 'ONVIF' : 'RTSP'}</span><span class="tag">${esc(c.ip)}</span>
        ${c.saved ? '<span class="tag">adicionada</span>'
                  : `<button class="icon primary" onclick="addFound(${i})">Adicionar</button>`}
      </div>
      <div class="url">${esc(c.display_url)}${c.streams?.length
          ? ' · ' + c.streams.map(s => `${s.width}x${s.height}`).join(', ') : ''}</div>
      ${c.error ? `<div class="err">${esc(c.error)}</div>` : ''}
      ${!c.onvif ? '<div class="err">Caminho RTSP adivinhado; use Testar ao adicionar.</div>' : ''}
    </div>`).join('');
}

function addFound(i) {
  const c = scanResults[i];
  const n = cameras.length + 1;
  openEdit(null, {name: `Câmera ${n}${c.name ? ' - ' + c.name : ''}`, rtsp_main: c.rtsp_main, rtsp_sub: c.rtsp_sub});
  afterSave = () => { c.saved = true; showScan({results: scanResults, message: $('#scanMsg').textContent}); };
}

loadCameras();
</script>
</body>
</html>
